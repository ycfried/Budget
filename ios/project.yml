# Local XcodeGen input. No cloud triggers, deployment, signing, or backend access.
name: OnBudget
options:
  bundleIdPrefix: example.onbudget.sample
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.4'
packages:
  OnBudgetCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGN_IDENTITY: ''
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    SUPPORTS_MACCATALYST: 'NO'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  OnBudget:
    type: application
    platform: iOS
    sources: [App, Resources]
    dependencies:
      - package: OnBudgetCore
      - target: OnBudgetWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.onbudget.sample
        CODE_SIGN_IDENTITY: ''
        INFOPLIST_KEY_CFBundleDisplayName: OnBudget Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_OnBudgetAppGroup: ''
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: OnBudget Sample
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OnBudgetAppGroup: ''
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [onbudget-sample]
  OnBudgetWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Resources/PrivacyInfo.xcprivacy]
    dependencies:
      - package: OnBudgetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.onbudget.sample.widget
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: OnBudget Widget
        INFOPLIST_KEY_OnBudgetAppGroup: ''
    info:
      path: Configuration/Widget-Info.plist
      properties:
        CFBundleDisplayName: OnBudget Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OnBudgetAppGroup: ''
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OnBudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
      - target: OnBudget
schemes:
  OnBudget:
    build:
      targets:
        OnBudget: all
        OnBudgetWidget: all
    test:
      gatherCoverageData: true
      targets: [OnBudgetUITests]
