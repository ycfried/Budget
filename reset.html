<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>OnBudget — Reset Your Password</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; background: #fff; color: #0f172a; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  p { color: #6b7280; line-height: 1.6; }
  label { display: block; font-size: 14px; font-weight: 700; margin-top: 16px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 6px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 16px; }
  button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px; background: #2f6bff; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .password-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .password-row input { flex: 1; margin-top: 0; }
  .password-row button { width: auto; margin-top: 0; padding: 12px 14px; background: #eef4ff; color: #2f6bff; }
  a { color: #2f6bff; }
  #msg { margin-top: 16px; padding: 12px; border-radius: 12px; background: #eef4ff; }
  #msg:empty { display: none; }
  #msg.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
</style>
</head>
<body>
<main>
  <h1>Reset Your Password</h1>
  <p>Password requirements: at least 8 characters.</p>
  <label>New Password <span class="password-row"><input id="newPassword" type="password" autocomplete="new-password"><button id="toggleNewPasswordBtn" type="button" aria-label="Show password" aria-pressed="false">Show</button></span></label>
  <label>Confirm New Password <span class="password-row"><input id="confirmPassword" type="password" autocomplete="new-password"><button id="toggleConfirmPasswordBtn" type="button" aria-label="Show password" aria-pressed="false">Show</button></span></label>
  <button id="saveBtn" type="button">Save New Password</button>
  <p id="msg"></p>
  <p><a href="live.html">Back to Sign In</a></p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const msg = $('msg');
// PKCE-style recovery links carry ?code=…; exchange it for a session so
// updateUser below runs as the recovering user. Hash-style links
// (#access_token=…) are picked up automatically by the Supabase client.
const code = new URLSearchParams(window.location.search).get('code');
if (code) {
  const { error } = await supabase.auth.exchangeCodeForSession(code);
  if (error) { msg.textContent = 'This reset link could not be used. Request a new one from the sign-in screen.'; msg.classList.add('error'); }
}
const wireToggle = (btnId, inputId) => {
  $(btnId)?.addEventListener('click', (e) => {
    const input = $(inputId); if (!input) return;
    const showing = input.type === 'password';
    input.type = showing ? 'text' : 'password';
    e.currentTarget.textContent = showing ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    e.currentTarget.setAttribute('aria-pressed', showing ? 'true' : 'false');
  });
};
wireToggle('toggleNewPasswordBtn', 'newPassword');
wireToggle('toggleConfirmPasswordBtn', 'confirmPassword');
$('saveBtn').addEventListener('click', async () => {
  const pw = $('newPassword').value;
  const confirm = $('confirmPassword').value;
  if (!pw || pw.length < 8) { msg.textContent = 'Enter a password of at least 8 characters.'; msg.classList.add('error'); return; }
  if (pw !== confirm) { msg.textContent = 'The two passwords do not match.'; msg.classList.add('error'); return; }
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error) { console.warn('password reset failed:', error.message); msg.textContent = 'Could not save the new password. The link may have expired — request a new one from the sign-in screen.'; msg.classList.add('error'); return; }
  msg.classList.remove('error');
  msg.textContent = 'Password saved. You can now sign in with it. Taking you back to sign in…';
  // P2-F12 (Nov 8, 2026): a saved password used to leave the user
  // on this dead page. Redirect to the app after 2s; the "Back to
  // Sign In" link below stays as the fallback.
  setTimeout(() => { window.location.href = 'live.html'; }, 2000);
});
</script>
</body>
</html>
