name: OnBudget iOS clone TestFlight upload
# Builds the app for a real device, signs it with automatic signing using
# the friend's App Store Connect API key, and uploads it to TestFlight
# (internal testing only — this workflow never submits for review).
#
# Secrets (repo secrets, already stored — never print them, never commit
# the .p8): ASC_API_KEY_P8 (the .p8 file contents), ASC_KEY_ID,
# ASC_ISSUER_ID. Key "OnBudget builds" has App Manager access; if
# automatic signing needs Admin (creating the distribution certificate
# / provisioning profile), the archive step fails and the key must be
# bumped to Admin by the account holder.
# Signing: the project carries DEVELOPMENT_TEAM = H38376B6RX (resolved
# once from the bundle id's seedId via the App Store Connect API) and
# the project-level CODE_SIGNING_ALLOWED = NO was removed — it silently
# disabled signing for every target, which produced an unsigned archive
# ("No Team Found in Archive" at export) on the first runs.
#
# Manual trigger: gh workflow run ios-clone-testflight-upload.yml --ref <branch>
# Push trigger (mirrors ios-clone-device-ipa.yml — workflow_dispatch
# lookup needs the file on the default branch, so push is the working
# trigger): any push to the branch below that touches this file starts
# an upload. WHEN MERGING TO ios-clone, change the push branch list to
# [ios-clone].
on:
  workflow_dispatch:
  push:
    branches: [ios-clone-testflight]
    paths:
      - '.github/workflows/ios-clone-testflight-upload.yml'
permissions:
  contents: read
concurrency:
  group: onbudget-ios-clone-testflight
  cancel-in-progress: false
jobs:
  testflight-upload:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 16.4
        run: |
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
      - name: Write App Store Connect API key (never printed)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "key file written (contents never echoed)"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios-clone/OnBudget.xcodeproj
      - name: Diagnose signing (certificates the team has; can this key create one?)
        run: |
          # One-time diagnosis for the archive failure: list the team's
          # certificates, and probe certificate creation with a
          # deliberately invalid CSR (a bad CSR can never create
          # anything; 403 = this key may not create certificates,
          # 400/422 = creation is allowed and the CSR was rejected).
          TOKEN=$(python3 - "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, json, subprocess, sys, time
          def b64u(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          key_id, issuer, key_path = sys.argv[1], sys.argv[2], sys.argv[3]
          now = int(time.time())
          header = b64u(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64u(json.dumps({"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}, separators=(",", ":")).encode())
          msg = f"{header}.{payload}".encode()
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key_path], input=msg, capture_output=True, check=True).stdout
          i = 2
          assert der[i] == 0x02; i += 1
          len_r = der[i]; i += 1
          r = der[i:i + len_r]; i += len_r
          assert der[i] == 0x02; i += 1
          len_s = der[i]; i += 1
          s = der[i:i + len_s]
          r = r.lstrip(b"\x00").rjust(32, b"\x00")
          s = s.lstrip(b"\x00").rjust(32, b"\x00")
          print(f"{header}.{payload}.{b64u(r + s)}")
          PY
          )
          echo "--- existing certificates ---"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/certificates" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(c['attributes'].get('certificateType'), '|', c['attributes'].get('displayName'), '|', c['attributes'].get('expirationDate')) for c in d.get('data', [])] or print('(none)')"
          echo "--- create-certificate probe (invalid CSR) ---"
          curl -s -o /tmp/cert-probe.json -w "HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"data":{"type":"certificates","attributes":{"certificateType":"IOS_DISTRIBUTION","csrContent":"aW52YWxpZA=="}}}' "https://api.appstoreconnect.apple.com/v1/certificates"
          head -c 600 /tmp/cert-probe.json; echo
      - name: Archive (signed, automatic signing via API key)
        run: |
          xcodebuild -project ios-clone/OnBudget.xcodeproj -scheme OnBudget -sdk iphoneos -configuration Release -derivedDataPath DerivedData -archivePath OnBudget.xcarchive archive \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export signed .ipa
        run: |
          cat > exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath OnBudget.xcarchive -exportPath Export -exportOptionsPlist exportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates
          echo "--- exported .ipa ---"
          ls -la Export/
      - name: Show build identity (bundle id, version, build)
        run: |
          mkdir -p /tmp/ipa-check && ditto -x -k Export/*.ipa /tmp/ipa-check
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          codesign -dv /tmp/ipa-check/Payload/OnBudget.app 2>&1 | head -20 || true
      - name: Upload to TestFlight (App Store Connect)
        run: |
          IPA=$(ls Export/*.ipa | head -1)
          test -n "$IPA" || { echo "FAIL: no .ipa in Export/"; exit 1; }
          echo "Uploading $IPA ..."
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Delete API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
