name: OnBudget iOS clone TestFlight upload
# Builds the app for a real device, signs it with automatic signing using
# the friend's App Store Connect API key, and uploads it to TestFlight
# (internal testing only — this workflow never submits for review).
#
# Secrets (repo secrets, already stored — never print them, never commit
# the .p8): ASC_API_KEY_P8 (the .p8 file contents), ASC_KEY_ID,
# ASC_ISSUER_ID. Key "OnBudget builds" has App Manager access; if
# automatic signing needs Admin (creating the distribution certificate
# / provisioning profile), the archive step fails and the key must be
# bumped to Admin by the account holder.
# Signing: the project MUST keep its project-level
# CODE_SIGNING_ALLOWED = NO — ios-clone/scripts/validate_project.py
# (run by the simulator workflow) requires it, and the scaffold's
# invariant is "no team baked into the project". Signing is therefore
# set ONLY here, as command-line overrides.
#
# MANUAL signing (not automatic): automatic signing cannot work on
# this team — it archives with the development identity, which needs
# a development provisioning profile, which needs at least one
# registered device, and the team has none. Manual signing with the
# App Store profile below needs no devices. (An earlier automatic
# attempt also proved CODE_SIGN_IDENTITY must NOT be passed with
# CODE_SIGN_STYLE=Automatic — Xcode calls that "conflicting
# provisioning settings". Manual + an explicit identity is fine.)
#
# Provisioning profile (created Nov 11, 2026 via the App Store
# Connect API with the "OnBudget builds" key — the key CAN create
# profiles, and CAN create certificates: an invalid-CSR probe
# returned HTTP 409 ATTRIBUTE.INVALID, not 403, so an Admin bump
# is NOT needed):
#   "OnBudget App Store" (IOS_APP_STORE), id 83TZ7C4533, ACTIVE,
#   bundle com.onbudget.ios (MZ58SJMG6V),
#   certificate 626P45U97T (DISTRIBUTION, "Mats Sellei", created
#   2026-09-06 — the friend's current distribution certificate; the
#   Dinner Made Easy profile was recreated against it the same day).
# The workflow downloads this profile from the API on every run.
#
# REMAINING BLOCKER — the .p12: the team is AT the distribution
# certificate limit (3 of 3: 626P45U97T, X775P4LLK4, XM224R3NU3),
# so no new distribution certificate can be created. Signing can
# only use one of the three existing ones, and their private keys
# live on the account holder's Mac. He must export the .p12 for
# the 2026-09-06 distribution certificate (Keychain Access) and
# have it stored as repo secrets ASC_SIGNING_P12 (base64 of the
# .p12 file) + ASC_SIGNING_P12_PASSWORD. The import step below is
# guarded on the secret existing, so the next run after the secrets
# land uses it automatically. Until then the archive fails at the
# signing step ("no signing certificate" / private key missing).
# NOTE: one of the early automatic-signing runs caused Xcode to
# create an orphaned DEVELOPMENT certificate via the API
# (MM546R8VD9, "Created via API", 2026-11-11T18:13 UTC) whose
# private key died with the ephemeral runner — it is harmless but
# should be revoked in the portal when convenient. Do NOT run this
# workflow with automatic signing again: each attempt risks another
# orphaned certificate.
#
# Manual trigger: gh workflow run ios-clone-testflight-upload.yml --ref <branch>
# Push trigger (mirrors ios-clone-device-ipa.yml — workflow_dispatch
# lookup needs the file on the default branch, so push is the working
# trigger): any push to the branch below that touches this file starts
# an upload. WHEN MERGING TO ios-clone, change the push branch list to
# [ios-clone].
on:
  workflow_dispatch:
  push:
    branches: [ios-clone-testflight]
    paths:
      - '.github/workflows/ios-clone-testflight-upload.yml'
permissions:
  contents: read
concurrency:
  group: onbudget-ios-clone-testflight
  cancel-in-progress: false
jobs:
  testflight-upload:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 16.4
        run: |
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
      - name: Write App Store Connect API key (never printed)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "key file written (contents never echoed)"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios-clone/OnBudget.xcodeproj
      - name: Import distribution certificate (.p12, only once the secret exists)
        if: ${{ secrets.ASC_SIGNING_P12 != '' }}
        run: |
          echo "${{ secrets.ASC_SIGNING_P12 }}" | base64 -d > "$RUNNER_TEMP/OnBudgetDist.p12"
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/OnBudgetDist.p12" -P "${{ secrets.ASC_SIGNING_P12_PASSWORD }}" -A -t cert -f pkcs12 -k build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          rm -f "$RUNNER_TEMP/OnBudgetDist.p12"
          echo "distribution certificate imported into build.keychain"
      - name: Download App Store provisioning profile
        run: |
          TOKEN=$(python3 - "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, json, subprocess, sys, time
          def b64u(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          key_id, issuer, key_path = sys.argv[1], sys.argv[2], sys.argv[3]
          now = int(time.time())
          header = b64u(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64u(json.dumps({"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}, separators=(",", ":")).encode())
          msg = f"{header}.{payload}".encode()
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key_path], input=msg, capture_output=True, check=True).stdout
          i = 2
          assert der[i] == 0x02; i += 1
          len_r = der[i]; i += 1
          r = der[i:i + len_r]; i += len_r
          assert der[i] == 0x02; i += 1
          len_s = der[i]; i += 1
          s = der[i:i + len_s]
          r = r.lstrip(b"\x00").rjust(32, b"\x00")
          s = s.lstrip(b"\x00").rjust(32, b"\x00")
          print(f"{header}.{payload}.{b64u(r + s)}")
          PY
          )
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/profiles/83TZ7C4533" | python3 -c "import base64,json,sys,os; d=json.load(sys.stdin); open(os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/OnBudget_AppStore.mobileprovision'),'wb').write(base64.b64decode(d['data']['attributes']['profileContent']))"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive (signed, manual signing with the App Store profile)
        run: |
          xcodebuild -project ios-clone/OnBudget.xcodeproj -scheme OnBudget -sdk iphoneos -configuration Release -derivedDataPath DerivedData -archivePath OnBudget.xcarchive archive \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="OnBudget App Store" \
            DEVELOPMENT_TEAM=H38376B6RX \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export signed .ipa
        run: |
          cat > exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.onbudget.ios</key>
              <string>OnBudget App Store</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath OnBudget.xcarchive -exportPath Export -exportOptionsPlist exportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="OnBudget App Store" \
            DEVELOPMENT_TEAM=H38376B6RX
          echo "--- exported .ipa ---"
          ls -la Export/
      - name: Show build identity (bundle id, version, build)
        run: |
          mkdir -p /tmp/ipa-check && ditto -x -k Export/*.ipa /tmp/ipa-check
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/ipa-check/Payload/OnBudget.app/Info.plist
          codesign -dv /tmp/ipa-check/Payload/OnBudget.app 2>&1 | head -20 || true
      - name: Upload to TestFlight (App Store Connect)
        run: |
          IPA=$(ls Export/*.ipa | head -1)
          test -n "$IPA" || { echo "FAIL: no .ipa in Export/"; exit 1; }
          echo "Uploading $IPA ..."
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Delete API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
