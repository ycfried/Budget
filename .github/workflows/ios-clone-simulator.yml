name: OnBudget iOS clone simulator proof (testflight branch)
# VERIFICATION COPY for the ios-clone-testflight branch only: runs the
# simulator suite against this branch's code so the bundle-id change
# (com.onbudget.app -> com.onbudget.ios) is proven not to break the
# simulator tests. Copied verbatim from
# origin/ios-clone-v66/scaffold:.github/workflows/ios-clone-simulator.yml
# except the trigger branch and the `if:` ref check, and a separate
# concurrency group so it can never cancel a scaffold run.
# DROP THIS FILE when merging to ios-clone — the scaffold branch
# remains the simulator line.
on:
  push:
    branches: [native-fix-ipad-sheets]
    paths:
      - 'ios-clone/**'
      - '.github/workflows/ios-clone-simulator.yml'
permissions:
  contents: read
concurrency:
  group: onbudget-ios-clone-simulator-ipadsheets
  cancel-in-progress: true
jobs:
  simulator:
    if: >-
      startsWith(github.ref, 'refs/heads/native-fix-ipad-sheets') &&
      github.event.repository.private == false &&
      startsWith(github.event.head_commit.message, 'ci(ios-clone): approved cloud build')
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write UI-test service key source
        # The UI test runner process does NOT inherit the step's
        # environment (run 43247037525 proved it: the step env held
        # the key, logged masked as ***, yet the runner saw nothing),
        # and it runs inside the simulator, so it cannot read a file
        # from the Mac runner's $HOME either (the 4bcad72 key file
        # was also uncompilable: 'homeDirectoryForCurrentUser' is
        # unavailable in iOS, run 43256312047). The key therefore
        # travels inside the test bundle: this step overwrites the
        # committed empty placeholder
        # ios-clone/OnBudgetUITests/UITestSecrets.swift — a real
        # source of the OnBudgetUITests target, so build-for-testing
        # compiles it into the .xctest — with a generated copy
        # carrying the key. The value is never printed (and GitHub
        # masks the secret in logs); the checkout is
        # runner-ephemeral and never committed. When the secret is
        # absent the placeholder stays empty and the helper fails
        # fast naming the missing secret.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            escaped_key="${SUPABASE_SERVICE_ROLE_KEY//\\/\\\\}"
            escaped_key="${escaped_key//\"/\\\"}"
            {
              printf '%s\n' '// OnBudget - UITestSecrets.swift (generated in CI; never commit a real key here)'
              printf '%s\n' '// Service-role key for the UI tests Admin API confirm path,'
              printf '%s\n' '// written by the simulator workflow from the SUPABASE_SERVICE_ROLE_KEY secret.'
              printf '%s\n' 'enum UITestSecrets {'
              printf '%s\n' "    static let serviceRoleKey = \"$escaped_key\""
              printf '%s\n' '}'
            } > ios-clone/OnBudgetUITests/UITestSecrets.swift
          fi
      - name: Validate, compile and test synthetic app
        env:
          ONBUDGET_APPROVED_WORKFLOW: '1'
          # Service-role key for the UI tests' Admin-API confirm path
          # (email confirmation is ON since Nov 12, 2026). Empty until
          # the repo secret SUPABASE_SERVICE_ROLE_KEY exists — the
          # helper then fails fast naming the missing secret.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash ios-clone/scripts/macos_simulator_test.sh
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onbudget-simulator-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            ios-clone/CloudResults/Attachments
            ios-clone/CloudResults/tests.xcresult
            ios-clone/CloudResults/test-summary.json
            ios-clone/CloudResults/runtimes.json
