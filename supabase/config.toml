# Supabase project configuration for GitHub "Deploy to production".
#
# Why this file exists (Nov 2, 2026): the dashboard code editor silently
# joins pasted lines, which broke the plaid-sync and week-close deploys
# three times. The GitHub integration deploys ONLY functions declared
# here under [functions.<slug>] -- without this file it deploys nothing.
# No database migrations exist in this repo, so a production deploy
# touches Edge Functions only. No secrets are declared here; the
# dashboard secrets (SERVICE_ROLE_SECRET, Plaid keys, etc.) stay as-is.
#
# verify_jwt notes (match how each function is actually called):
# - false ONLY for the functions called by outside services that
#   send no Supabase JWT: plaid-webhook (Plaid sends its own signature
#   header, verified inside the function) and ingest-amex-alert (Apps
#   Script sends an HMAC header, verified inside the function).
#   Gmail additions: gmail-oauth-callback (Google redirects the
#   browser here, no JWT) and gmail-poll (dual auth verified inside
#   the function: admin JWT or service-key bearer, so a future
#   scheduled trigger can call it without a user session).
# - true for everything the app calls with the signed-in user's JWT;
#   each of those functions also verifies the caller itself.

[functions.compute-week]
verify_jwt = true

[functions.plaid-link]
verify_jwt = true

[functions.plaid-exchange]
verify_jwt = true

[functions.plaid-sync]
verify_jwt = false

[functions.plaid-webhook]
verify_jwt = false

[functions.plaid-webhook-register]
verify_jwt = true

[functions.plaid-disconnect]
verify_jwt = true

[functions.plaid-account-disconnect]
verify_jwt = true

[functions.ingest-amex-alert]
verify_jwt = false

[functions.week-close]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.gmail-oauth-start]
verify_jwt = true

[functions.gmail-oauth-callback]
verify_jwt = false

[functions.gmail-poll]
verify_jwt = false

[functions.gmail-disconnect]
verify_jwt = true
